<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngữ văn THPT – Kết nối tri thức</title>

<style>
:root{
  --bg:#f2f4f8;
  --card:rgba(255,255,255,.82);
  --accent:#5b6fd6;
  --text:#1f2937;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Segoe UI",system-ui;
  background:var(--bg);
  color:var(--text);
  padding:16px;
}

h1{
  text-align:center;
  font-size:clamp(22px,4vw,32px);
  margin-bottom:12px;
}

.top{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

button{
  border:none;
  border-radius:14px;
  padding:8px 14px;
  font-size:14px;
  cursor:pointer;
  background:var(--accent);
  color:#fff;
}

.card{
  background:var(--card);
  backdrop-filter:blur(8px);
  border-radius:18px;
  padding:14px;
  margin-bottom:18px;
  box-shadow:0 10px 28px rgba(0,0,0,.08);
}

.grade{
  text-align:center;
  font-weight:700;
  font-size:clamp(18px,3.5vw,22px);
  cursor:pointer;
}

.lesson, .text{
  margin-top:10px;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
}

.lesson{background:#e6ecff;font-weight:600}
.text{background:#f4f6fb;margin-left:12px}

.box{
  overflow:hidden;
  max-height:0;
  opacity:0;
  transition:.4s ease;
}

.box.show{
  max-height:2000px;
  opacity:1;
}

.option{
  margin:6px 0 6px 24px;
  font-size:14px;
}

.option input[type=text]{
  width:100%;
  padding:6px;
  margin-top:4px;
}

a{color:var(--accent);text-decoration:none}
</style>
</head>

<body>

<h1>📚 Ngữ văn THPT – Kết nối tri thức</h1>

<div class="top">
  <button id="modeBtn">🎓 Học sinh</button>
  <button id="shareBtn" style="display:none">🔗 Tạo link chia sẻ</button>
</div>

<div id="app"></div>

<script>
/* ===== MODE ===== */
let MODE = "student";

/* ===== OPTIONS ===== */
const OPTIONS = [
  {key:"author",label:"👤 Giới thiệu tác giả"},
  {key:"work",label:"📘 Giới thiệu tác phẩm"},
  {key:"video",label:"🎥 Video bài học"},
  {key:"practice",label:"📝 Câu hỏi ôn tập"}
];

/* ===== DATA KHUNG (KHÔNG LINK) ===== */
const STRUCTURE = {
  12:{
    "Bài 1: Khả năng lớn lao của tiểu thuyết":[
      "Xuân Tóc Đỏ cứu quốc","Nỗi buồn chiến tranh"
    ],
    "Bài 2: Những thế giới thơ":[
      "Cảm hoài","Tây Tiến","Đàn ghi ta của Lor-ca"
    ]
  }
};

/* ===== LOAD DATA FROM URL ===== */
let DATA_LINKS = {};
const hash = location.hash;
if(hash.startsWith("#DATA=")){
  try{
    DATA_LINKS = JSON.parse(decodeURIComponent(atob(hash.slice(6))));
  }catch(e){}
}

/* ===== UI ===== */
const app = document.getElementById("app");
const modeBtn = document.getElementById("modeBtn");
const shareBtn = document.getElementById("shareBtn");

modeBtn.onclick = ()=>{
  MODE = MODE==="student"?"teacher":"student";
  modeBtn.textContent = MODE==="student"?"🎓 Học sinh":"🧑‍🏫 Giáo viên";
  shareBtn.style.display = MODE==="teacher"?"inline-block":"none";
  render();
};

shareBtn.onclick = ()=>{
  const encoded = btoa(encodeURIComponent(JSON.stringify(DATA_LINKS)));
  const url = location.origin + location.pathname + "#DATA=" + encoded;
  prompt("🔗 Copy link này để chia sẻ:",url);
};

function toggle(box){
  box.classList.toggle("show");
}

/* ===== RENDER ===== */
function render(){
  app.innerHTML="";
  for(const grade in STRUCTURE){
    const card=document.createElement("div");
    card.className="card";

    const g=document.createElement("div");
    g.className="grade";
    g.textContent="📖 Lớp "+grade;

    const gbox=document.createElement("div");
    gbox.className="box";
    g.onclick=()=>toggle(gbox);

    for(const lesson in STRUCTURE[grade]){
      const l=document.createElement("div");
      l.className="lesson";
      l.textContent=lesson;

      const lbox=document.createElement("div");
      lbox.className="box";
      l.onclick=()=>toggle(lbox);

      STRUCTURE[grade][lesson].forEach(text=>{
        const t=document.createElement("div");
        t.className="text";
        t.textContent="📘 "+text;

        const obox=document.createElement("div");
        obox.className="box";
        t.onclick=()=>toggle(obox);

        const key=`${grade}-${lesson}-${text}`;
        DATA_LINKS[key] ||= {};

        OPTIONS.forEach(opt=>{
          const row=document.createElement("div");
          row.className="option";

          if(MODE==="teacher"){
            row.innerHTML=`
              ${opt.label}
              <input type="text" placeholder="Nhập link..."
              value="${DATA_LINKS[key][opt.key]||""}">
            `;
            row.querySelector("input").oninput=e=>{
              DATA_LINKS[key][opt.key]=e.target.value.trim();
            };
          }else{
            const link=DATA_LINKS[key][opt.key];
            row.innerHTML=link?`<a href="${link}" target="_blank">${opt.label}</a>`:`<span style="opacity:.4">${opt.label}</span>`;
          }

          obox.appendChild(row);
        });

        lbox.appendChild(t);
        lbox.appendChild(obox);
      });

      gbox.appendChild(l);
      gbox.appendChild(lbox);
    }

    card.appendChild(g);
    card.appendChild(gbox);
    app.appendChild(card);
  }
}

render();
</script>

</body>
</html>
